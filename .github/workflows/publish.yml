# Publishes the StarHostAI CLI Tools connector to npm whenever a tag like
# `v0.1.0` is pushed. Add an npm access token as the `NPM_TOKEN` secret in the
# repository settings.
name: Publish starhostai-tools to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Bump version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$VERSION"
        shell: bash

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}